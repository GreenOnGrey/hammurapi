apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hammurapi.fullname" . }}
  labels: {{- include "hammurapi.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  # Nabu is required (FTR.HMR.CMN-0007 R1): the agent of Hammurapi.
  NABU_URL: {{ required "nabu.url is required: Hammurapi works only with Nabu" .Values.nabu.url | quote }}
  NABU_CLIENT_ID: {{ required "nabu.clientId is required: the service client of Hammurapi in Nabu" .Values.nabu.clientId | quote }}
  {{- with .Values.nabu.webUrl }}
  NABU_WEB_URL: {{ . | quote }}
  {{- end }}
  # The MCP of runs of the worker: the service agents of Nabu call it.
  WORKER_MCP_ADDR: ":8083"
  NABU_WORKER_MCP_URL: {{ .Values.nabu.workerMcpUrl | default (printf "http://%s-worker.%s.svc:8083/mcp" (include "hammurapi.fullname" .) .Release.Namespace) | quote }}
