# Core image (release target of hammurapi-core: one static binary). Used by every mode.
# The agent lives in Nabu (FTR.HMR.CMN-0007): there is no agent image here.
image:
  {
    repository: registry.example.com/hammurapi-core,
    tag: "1.2.0",
    pullPolicy: IfNotPresent,
  }
# Optional smaller image for cleaner and migrate (e.g. the distroless default target); defaults to `image`.
coreImage: {}
web:
  enabled: true
  image:
    {
      repository: registry.example.com/hammurapi-web,
      tag: "1.1.0",
      pullPolicy: IfNotPresent,
    }
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 64Mi } }

imagePullSecrets: []

api:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi } }
  extraEnv: []
worker:
  replicas: 1
  # Runs of the service agents of Nabu, code tasks in the sandbox of Nabu and the MCP of runs (:8083).
  resources: { requests: { cpu: 200m, memory: 512Mi } }

# Nabu — the agent of Hammurapi (FTR.HMR.CMN-0006, FTR.HMR.CMN-0007). Required:
# Hammurapi does not start without it. The client secret goes to the Secret as
# NABU_CLIENT_SECRET.
nabu:
  # API of Nabu, e.g. https://nabu-api.example.com
  url: ""
  # Service client of Hammurapi in Nabu (Administration of Nabu → Clients).
  clientId: ""
  # The site of Nabu: links from code tasks to its runs (optional).
  webUrl: ""
  # How the service agents of Nabu reach the MCP of the worker; defaults to the
  # worker service inside the cluster (Nabu in the same cluster).
  workerMcpUrl: ""
cleaner:
  schedule: "0 3 * * *"
  resources: { requests: { cpu: 50m, memory: 64Mi } }
migrate:
  resources: { requests: { cpu: 50m, memory: 64Mi } }

podSecurityContext:
  { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
securityContext:
  {
    allowPrivilegeEscalation: false,
    readOnlyRootFilesystem: false,
    capabilities: { drop: [ALL] },
  }

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: hammurapi.example.com
  tls: [] # - { secretName: hammurapi-tls, hosts: [hammurapi.example.com] }
  annotations: {}
  # Binds a user to one api pod by cookie: the SSE stream with the chat answer lives there.
  stickySessions: true

probes:
  liveness: { path: /healthz, port: 9100 }
  readiness: { path: /readyz, port: 9100 }

# Non-secret configuration (ConfigMap). See docs/configuration.md.
config:
  PUBLIC_URL: https://hammurapi.example.com
  GIT_PROVIDER: gitlab
  GIT_BASE_URL: https://gitlab.com
  GIT_REPO: product/specs
  GIT_DEFAULT_BRANCH: main
  BOOTSTRAP_ADMINS: ""
  # Login of the bot account (GitLab) / GitHub App slug + [bot]; its commits and reviews are not the users'.
  HAMMURAPI_BOT_LOGIN: hammurapi-bot
  # Base URL of /hooks/v1/* given to CI and deploy systems; defaults to PUBLIC_URL.
  HOOKS_URL: ""
  # Code tasks in the sandbox of Nabu.
  CODE_TIMEOUT: 2h
  CODE_MAX_PARALLEL: "10"
  WORKFLOW_MAX_ATTEMPTS: "8"
  WORKFLOW_LEASE: 2m
  DISCOVERY_TIMEOUT: 20m
  WRITER_TIMEOUT: 30m
  KAFKA_BROKERS: kafka:9092
  S3_ENDPOINT: minio:9000
  S3_BUCKET: hammurapi
  S3_USE_SSL: "false"
  WHISPER_URL: http://whisper:9000
  UPLOAD_MAX_BYTES: "20971520"
  IMPORT_MAX_BYTES: "52428800"
  IMPORT_MAX_UNCOMPRESSED_BYTES: "209715200"
  IMPORT_MAX_FILES: "500"
  LOG_LEVEL: info
  DEFAULT_LANGUAGE: en
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

# Secrets: reference an existing Secret (recommended) …
existingSecret: hammurapi-secrets
# … or let the chart create one from these values (existingSecret: "").
secrets: {}
  # DATABASE_URL: postgres://…
  # TOKEN_ENCRYPTION_KEY: <openssl rand -base64 32>
  # WEBHOOK_SECRET: …
  # GITLAB_CLIENT_ID / GITLAB_CLIENT_SECRET or GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
  # S3_ACCESS_KEY / S3_SECRET_KEY
  # NABU_CLIENT_SECRET: …         (required: the secret of the service client of Hammurapi in Nabu)
  # GITLAB_BOT_TOKEN: …            (GitLab: token of the bot account; GitHub uses the App)
  # CI_RESULTS_SECRET: …           (HMAC of /hooks/v1/ci-results; two comma-separated values while rotating)

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}
